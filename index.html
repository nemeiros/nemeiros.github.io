<title>Nemeiros</title>

<style>
:root{--bg:#0c0c0f;--fg:#f1f1f4;--acc:#94b8fa;--mut:rgba(148,184,250,.78);--line:rgba(255,255,255,.15);--surf:rgba(255,255,255,.06);--glow:0 0 22px rgba(148,184,250,.38);--glow-s:0 0 12px rgba(148,184,250,.3);--dim:.0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f8;--fg:#16161a;--acc:#2f63c4;--mut:rgba(47,99,196,.85);--line:rgba(0,0,0,.15);--surf:rgba(0,0,0,.05);--glow:none;--glow-s:none;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0c0c0f;--fg:#f1f1f4;--acc:#94b8fa;--mut:rgba(148,184,250,.78);--line:rgba(255,255,255,.15);--surf:rgba(255,255,255,.06);--glow:0 0 22px rgba(148,184,250,.38);--glow-s:0 0 12px rgba(148,184,250,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:500 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bgimg,none) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim)}
main{max-width:704px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;height:40px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b3b45,#5d5d6b);object-fit:cover;display:grid;place-items:center;font-weight:600;flex:none;box-shadow:var(--glow-s)}
header b{font-weight:600;font-size:17px;flex:1;text-shadow:var(--glow-s)}
header a:last-child{font-size:15px;color:var(--acc);text-shadow:var(--glow-s);transition:text-shadow .2s}
header a:last-child:hover{text-shadow:var(--glow)}
.hero{margin-top:64px}
h1{font-weight:500;font-size:clamp(40px,7vw,48px);line-height:1.1;margin:0 0 20px;letter-spacing:-.015em;text-shadow:var(--glow)}
.bio{font-size:17px;line-height:1.45;margin:0 0 20px;max-width:600px;text-shadow:0 0 14px rgba(148,184,250,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.4;background:var(--surf);color:var(--acc);text-shadow:var(--glow-s);transition:border-color .2s,box-shadow .2s}
.chip:hover{border-color:var(--acc);box-shadow:0 0 14px rgba(148,184,250,.22)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip svg{width:18px;height:18px}
.soc{display:flex;gap:26px;flex-wrap:wrap;color:var(--acc)}
.soc a{padding:2px;border-radius:6px;transition:transform .2s,filter .2s;filter:drop-shadow(0 0 5px rgba(148,184,250,.35))}
.soc a[aria-label="discord"] svg {
  overflow: visible;
}
.br{fill:currentColor;stroke:none}
.soc a:hover{transform:translateY(-2px);filter:drop-shadow(0 0 9px rgba(148,184,250,.7))}
section{margin-top:72px}
h2{font-weight:500;font-size:16px;color:var(--mut);margin:0 0 14px}
.more{display:inline-block;color:var(--acc);font-size:15px;margin-top:18px;text-shadow:var(--glow-s)}
/* player */
.pl{display:flex;align-items:center;gap:16px;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--surf);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--acc)}
.cv{width:64px;height:64px;border-radius:14px;flex:none;background-size:cover;background-position:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pm{flex:1;min-width:0}
.ti{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--glow-s);margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tm{font-size:15px;font-variant-numeric:tabular-nums;min-width:38px}
.sk{flex:1;min-width:90px;height:16px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;--p:0%}
.sk::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),var(--line) var(--p))}
.sk::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
.sk::-moz-range-progress{height:3px;border-radius:3px;background:var(--acc)}
.sk::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;box-shadow:none}
.sk::-moz-range-thumb{width:0;height:0;border:0}
.sk:hover::-webkit-slider-thumb,.sk:focus-visible::-webkit-slider-thumb{width:11px;height:11px;border-radius:50%;background:var(--acc);margin-top:-4px;box-shadow:var(--glow-s)}
.ctl{display:flex;align-items:center;gap:6px;margin-left:6px}
.ctl button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--acc);cursor:pointer;transition:transform .15s,background .2s,filter .2s}
.ctl button:hover{background:var(--surf);filter:drop-shadow(0 0 6px rgba(148,184,250,.6))}
.ctl button:active{transform:scale(.88)}
.ctl svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ctl .pp svg{width:26px;height:26px}
.post{display:block;margin-bottom:14px;padding:12px 16px 13px;border-radius:12px;background:transparent;transition:background .2s,transform .2s}
a.post:hover,a.post:focus-visible{background:rgba(255,255,255,.085);transform:translateY(-1px)}
.post .meta,.full .meta{display:block;font-size:14px;line-height:1.4;color:var(--mut);font-weight:500}
.post h3{margin:3px 0 2px;font-size:17px;line-height:1.35;font-weight:600;color:var(--acc);text-shadow:var(--glow-s);transition:color .2s,text-shadow .2s}
a.post:hover h3{color:var(--acc);text-shadow:var(--glow-s)}
.post p{margin:0;color:var(--fg);font-size:15px;line-height:1.45}
.full h1{font-size:clamp(30px,6vw,38px);margin:0 0 10px}
.full .meta{margin-bottom:28px}
.full .body{font-size:17px;line-height:1.7;max-width:64ch;margin-bottom:12px;overflow-wrap:anywhere}
.full .body p{margin:0 0 18px}
.full .body ul{margin:0 0 18px;padding-left:24px}
.full .body li{padding-left:2px;margin:3px 0}
.full .body strong{font-weight:600}
.full button{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:6px 0;display:block;margin-bottom:12px}
footer{margin-top:auto;padding-top:96px;font-size:15px;color:var(--mut)}
a:focus-visible,.ctl button:focus-visible,.sk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
#home>section:nth-of-type(3){animation-delay:.54s}
.hero>*,#home>section,footer{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero>:nth-child(2){animation-delay:.08s}.hero>:nth-child(3){animation-delay:.16s}.hero>:nth-child(4){animation-delay:.24s}
#home>section:nth-of-type(1){animation-delay:.34s}#home>section:nth-of-type(2){animation-delay:.44s}
#writing section>*:not(#posts),#post .more{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
#post .full>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
#posts .post,#latest .post,#pinned .post{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
#writing .more,#post .more{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (max-width:460px){.cv{width:56px;height:56px}.pl{gap:12px;padding:12px}.ctl{margin-left:auto}}
/* click to enter */
body.gated{overflow:hidden}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;cursor:pointer;background:rgba(10,10,14,.5);-webkit-backdrop-filter:blur(24px) saturate(1.1);backdrop-filter:blur(24px) saturate(1.1);clip-path:circle(150vmax at var(--x,50%) var(--y,50%));transition:clip-path .95s cubic-bezier(.7,0,.2,1),opacity .95s ease;--mx:50%;--my:50%}
#gate::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(148,184,250,.16),transparent 70%);pointer-events:none}
#gate.go{clip-path:circle(0 at var(--x,50%) var(--y,50%));opacity:0;pointer-events:none}
.gate-in{position:relative;padding:24px;animation:gin 1s cubic-bezier(.2,.7,.2,1) both}
.gate-name{font-size:clamp(36px,9vw,56px);font-weight:500;letter-spacing:-.015em;line-height:1.1;text-shadow:var(--glow)}
.gate-hint{margin-top:14px;font-size:16px;color:var(--acc);text-shadow:var(--glow-s);letter-spacing:.08em;animation:breathe 2.8s ease-in-out infinite}
@keyframes gin{from{opacity:0;transform:translateY(8px) scale(.98);filter:blur(6px)}}
@keyframes breathe{50%{opacity:.4}}
body.gated main *{animation-play-state:paused!important}
#gate:focus,#gate:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}#gate.go{display:none}}
</style>

</main>

const BRANDS=['github','discord','patreon','steam'];
const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"'+(BRANDS.includes(n)?' class="br"':'')+'>'+I[n]+'</svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const au=$('au'), T=CONFIG.tracks; let cur=0;
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'--:--';
const dfmt=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

document.title=CONFIG.name;
$('name').textContent=CONFIG.name;
$('bio').textContent=CONFIG.bio;
$('av').innerHTML=CONFIG.avatar?'<img class="av" alt="" src="'+esc(CONFIG.avatar)+'">':esc(CONFIG.name[0]);
$('chips').innerHTML=CONFIG.chips.map(c=>'<span class="chip">'+svg(c[0])+esc(c[1])+'</span>').join('');
$('soc').innerHTML=CONFIG.socials.map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener" aria-label="'+s[0]+'">'+svg(s[0])+'</a>').join('');
if(CONFIG.background){$('bg').style.setProperty('--bgimg','url("'+CONFIG.background+'")');document.documentElement.style.setProperty('--dim','.6');}

/* ---- music ---- */
const pc='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',pa='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function info(){
  const t=T[cur];
  $('ti').textContent=t.artist+' - '+t.title;
  $('cv').style.backgroundImage=t.cover?'url("'+t.cover+'")':'linear-gradient(150deg,'+t.colors[0]+','+t.colors[1]+')';
  $('t2').textContent=fmt(t.dur);$('t1').textContent='0:00';$('sk').value=0;$('sk').style.setProperty('--p','0%');
  $('pp').innerHTML=au.paused?pc:pa;$('pp').setAttribute('aria-label',au.paused?'Play':'Pause');
}
function go(n,auto){
  cur=(n+T.length)%T.length;
  if(T[cur].src){au.src=T[cur].src;if(auto)au.play().catch(()=>{});}else{au.pause();au.removeAttribute('src');}
  info();
}
$('pp').onclick=()=>{if(!T[cur].src)return;if(!au.src)au.src=T[cur].src;au.paused?au.play():au.pause();};
$('pv').onclick=()=>go(cur-1,!au.paused);
$('nx').onclick=()=>go(cur+1,!au.paused);
au.addEventListener('play',()=>{$('pp').innerHTML=pa;});
au.addEventListener('pause',()=>{$('pp').innerHTML=pc;});
au.addEventListener('loadedmetadata',()=>{T[cur].dur=au.duration;$('t2').textContent=fmt(au.duration);});
au.addEventListener('timeupdate',()=>{if(!au.duration)return;const p=au.currentTime/au.duration*100;$('t1').textContent=fmt(au.currentTime)==='--:--'?'0:00':fmt(au.currentTime);$('sk').value=p*10;$('sk').style.setProperty('--p',p+'%');});
$('sk').addEventListener('input',e=>{if(au.duration){au.currentTime=e.target.value/1000*au.duration;e.target.style.setProperty('--p',e.target.value/10+'%');}});
au.addEventListener('ended',()=>{for(let k=1;k<=T.length;k++){const n=(cur+k)%T.length;if(T[n].src){go(n,true);return;}}});
/* ---- writing: static posts only; edit CONFIG.posts above ---- */
const allPosts=()=>CONFIG.posts.slice().sort((a,b)=>b.ts-a.ts);
const readingTime=p=>Math.max(1,Math.ceil((String(p.body||'').trim().match(/\S+/g)||[]).length/200));
const meta=p=>dfmt(p.ts)+' · '+readingTime(p)+' min read';
const first=p=>esc(p.preview!=null?String(p.preview):(String(p.body||'').split(/\n\s*\n/)[0]||'').replace(/\n/g,' ').slice(0,160));
function inlineFormat(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function formatBody(body){
  const lines=String(body||'').replace(/\r/g,'').split('\n');
  const out=[]; let para=[], list=[];
  const flushPara=()=>{if(para.length){out.push('<p>'+para.map(inlineFormat).join('<br>')+'</p>');para=[];}};
  const flushList=()=>{if(list.length){out.push('<ul>'+list.map(x=>'<li>'+inlineFormat(x)+'</li>').join('')+'</ul>');list=[];}};
  for(const line of lines){
    const m=line.match(/^\s*(?:[-*•])\s+(.+)$/);
    if(m){flushPara();list.push(m[1]);}
    else if(!line.trim()){flushPara();flushList();}
    else{flushList();para.push(line);}
  }
  flushPara();flushList();return out.join('');
}
function postCard(p,i=0,pin=false){return '<a class="post" style="--i:'+i+'" href="#post-'+esc(p.id)+'"><span class="meta">'+(pin?'Đã ghim · ':'')+meta(p)+'</span><h3>'+esc(p.title)+'</h3><p>'+first(p)+'</p></a>';}
const pinnedPosts=()=>allPosts().filter(p=>p.pinned).slice(0,2);
function renderPosts(){
  const ps=allPosts(), pin=pinnedPosts(), rest=ps.filter(p=>!pin.includes(p));
  $('pinned').innerHTML=pin.map((p,i)=>postCard(p,i)).join('');$('pinsec').hidden=!pin.length;
  $('latest').innerHTML=rest.slice(0,5).map((p,i)=>postCard(p,i)).join('');$('latsec').hidden=!rest.length;
  $('posts').innerHTML=pin.concat(rest).map((p,i)=>postCard(p,i,pin.includes(p))).join('');
  renderFull();
}
function renderFull(){
  const h=location.hash.slice(1);
  if(h.indexOf('post-')!==0)return;
  const id=h.slice(5), p=allPosts().find(x=>x.id===id);
  $('full').innerHTML=p?'<h1 style="--i:0">'+esc(p.title)+'</h1><span class="meta" style="--i:1">'+meta(p)+'</span><div class="body" style="--i:2">'+formatBody(p.body)+'</div>'
    :'<h1 style="--i:0">Post not found</h1>';
}
let lastView='';
function route(){
  const h=location.hash.slice(1);
  const v=h==='writing'?'writing':h.indexOf('post-')===0?'post':'home';
  $('home').hidden=v!=='home';$('writing').hidden=v!=='writing';$('post').hidden=v!=='post';$('wl').hidden=v!=='home';
  if(v==='post')renderFull();
  if(v!==lastView||v==='post')window.scrollTo(0,0);
  lastView=v;
}
addEventListener('hashchange',route);
/* ---- weather effects: snow / rain ---- */
(function(){
  const mode=String(new URLSearchParams(location.search).get('effect')||CONFIG.effect||'none').toLowerCase();
  const cv=$('fx');
  if((mode!=='snow'&&mode!=='rain')||matchMedia('(prefers-reduced-motion: reduce)').matches){cv.remove();return;}
  const ctx=cv.getContext('2d'), R=Math.random, rs=[5,8,12,4,7];
  let W,H,dpr,parts=[],sprites=[],last=0,tm;
  function flake(s,col){const c=document.createElement('canvas');c.width=c.height=Math.ceil(2*s*dpr);const g=c.getContext('2d');
    g.scale(dpr,dpr);g.translate(s,s);g.strokeStyle=col;g.lineWidth=Math.max(1,s/8);g.lineCap='round';
    for(let i=0;i<6;i++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(0,0);g.lineTo(0,s*.92);g.moveTo(0,s*.5);g.lineTo(s*.26,s*.74);g.moveTo(0,s*.5);g.lineTo(-s*.26,s*.74);g.stroke();}
    return c;}
  function dot(s,col){const c=document.createElement('canvas');c.width=c.height=Math.ceil(2*s*dpr);const g=c.getContext('2d');
    g.scale(dpr,dpr);const gr=g.createRadialGradient(s,s,0,s,s,s);gr.addColorStop(0,col);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(0,0,2*s,2*s);return c;}
  function init(){
    dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const col=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#fff';
    if(mode==='snow'){
      sprites=[flake(5,col),flake(8,col),flake(12,col),dot(4,col),dot(7,col)];
      const n=Math.max(30,Math.min(90,Math.round(W*H/20000)));
      parts=Array.from({length:n},()=>{const k=R()<.7?Math.floor(R()*3):3+Math.floor(R()*2),s=rs[k];
        return{x:R()*W,y:R()*H,k,s,vy:10+s*2*(.7+R()*.6),amp:8+R()*22,ph:R()*6.28,sp:.3+R()*.5,rot:R()*6.28,rv:(R()-.5)*.6,a:.22+R()*.33};});
    }else{
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.lineCap='round';
      const n=Math.max(50,Math.min(180,Math.round(W*H/9000)));
      parts=Array.from({length:n},()=>({x:R()*W,y:R()*H,len:10+R()*14,vy:420+R()*260,a:.1+R()*.2}));
    }
  }
  function frame(t){
    const dt=Math.min(.05,(t-last)/1000||0);last=t;ctx.clearRect(0,0,W,H);
    if(mode==='snow'){
      for(const p of parts){p.y+=p.vy*dt;p.ph+=p.sp*dt;p.rot+=p.rv*dt;
        if(p.y>H+20){p.y=-20;p.x=R()*W;}
        ctx.globalAlpha=p.a;ctx.save();ctx.translate(p.x+Math.sin(p.ph)*p.amp,p.y);ctx.rotate(p.rot);ctx.drawImage(sprites[p.k],-p.s,-p.s,2*p.s,2*p.s);ctx.restore();}
    }else{
      for(const p of parts){p.y+=p.vy*dt;p.x+=p.vy*.15*dt;
        if(p.y>H+p.len){p.y=-p.len;p.x=R()*W;}if(p.x>W+20)p.x-=W+40;
        ctx.globalAlpha=p.a;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len*.15,p.y-p.len);ctx.stroke();}
    }
    ctx.globalAlpha=1;requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{clearTimeout(tm);tm=setTimeout(init,150);});
  init();requestAnimationFrame(frame);
})();
/* ---- click to enter ---- */
(function(){
  const g=$('gate');
  if(!CONFIG.enterScreen){g.remove();document.body.classList.remove('gated');return;}
  $('gname').textContent=CONFIG.name;$('ghint').textContent=CONFIG.enterText||'click to enter';
  let done=false;
  g.addEventListener('pointermove',e=>{g.style.setProperty('--mx',e.clientX+'px');g.style.setProperty('--my',e.clientY+'px');});
  function enter(x,y){
    if(done)return;done=true;
    g.style.setProperty('--x',x+'px');g.style.setProperty('--y',y+'px');
    g.classList.add('go');document.body.classList.remove('gated');
    if(CONFIG.autoplayMusic&&T[cur]&&T[cur].src){if(!au.src)au.src=T[cur].src;au.play().catch(()=>{});}
    setTimeout(()=>g.remove(),1100);
  }
  g.addEventListener('click',e=>enter(e.clientX,e.clientY));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter(innerWidth/2,innerHeight/2);}});
  g.focus({preventScroll:true});
})();
info();renderPosts();route();
</script>
